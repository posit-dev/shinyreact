url: https://posit-dev.github.io/shinyreact/r
# Sibling of the Quarto site (landing + py/) and TypeDoc (js/), so one deploy
# folder holds the whole site.
destination: ../docs/_build/r
template:
  bootstrap: 5
reference:
  - title: Pages
    contents: [page_bare, page_react, page_react_html, page_react_dep]
  - title: Outputs
    contents: [reactive_output]
  - title: Messaging
    contents: [send_message]
  - title: Testing
    contents: [wire_tap]
