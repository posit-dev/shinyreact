[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shinyjson"
version = "0.1.0"
description = "Shiny UI infrastructure for JSON-based component rendering"
requires-python = ">=3.11"
dependencies = [
    "shiny>=1.2.0",
    "htmltools>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pkg-py/src/shinyjson"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pyright>=1.1.0",
    "ruff>=0.6.0",
    "pytest-cov>=5.0.0",
]

[tool.pyright]
include = ["pkg-py/src/shinyjson"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
