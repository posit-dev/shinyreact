[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shinyreact"
version = "0.1.0"
description = "Shiny UI infrastructure for React-based component rendering"
requires-python = ">=3.10"
dependencies = [
    "shiny>=1.2.0",
    "htmltools>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pkg-py/src/shinyreact"]

[dependency-groups]
examples = [
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "python-dotenv>=1.0.0",
    "chatlas>=0.1.0",
    "shinywidgets>=0.8.0",
    "plotly>=6.7.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pyright>=1.1.0",
    "ruff>=0.6.0",
    "pytest-cov>=5.0.0",
    "tox>=4.0.0",
    "tox-uv>=1.0.0",
    "pre-commit>=4.0.0",
    "playwright>=1.59.0",
    "pytest-playwright>=0.7.2",
]
tests-e2e = [
    "pytest-playwright>=0.5.0",
    "shiny[playwright]>=1.2.0",
    "shinywidgets>=0.8.0",
    "plotly>=6.7.0",
    "pandas>=2.1.0",
]

[tool.pytest.ini_options]
# Default test runs exclude the Playwright integration suite — it depends on
# pytest-playwright spinning up a real browser and a real Shiny process, which
# leaves the asyncio event loop in a state that confuses the unit tests that
# follow it. Run the Playwright suite explicitly via `make py-check-playwright`.
testpaths = ["pkg-py/tests"]
addopts = "--ignore=pkg-py/tests/playwright"

[tool.pyright]
include = ["pkg-py/src/shinyreact"]
pythonVersion = "3.10"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["pkg-py/tests"]
addopts = "--ignore=pkg-py/tests/playwright"

[tool.ruff]
line-length = 88
extend-exclude = ["examples/shiny-react-upstream"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.tox]
legacy_tox_ini = """
[tox]
env_list = type-py3{10,11,12,13,14}, py3{10,11,12,13,14}
isolated_build = True

[testenv]
package = wheel
wheel_build_env = .pkg
commands = pytest

[testenv:type]
deps =
  pyright
  pytest
commands = pyright
"""
