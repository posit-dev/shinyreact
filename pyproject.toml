[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shinyreact"
version = "0.1.0"
description = "Shiny UI infrastructure for React-based component rendering"
requires-python = ">=3.10"
dependencies = [
    "shiny @ git+https://github.com/posit-dev/py-shiny.git@schloerke/issue-2462",  # TODO(#216): release pin once py-shiny#2475 ships
    "htmltools>=0.7.0",
]

[tool.hatch.metadata]
# TODO(#216): remove with the git dep once py-shiny#2475 ships in a release.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [
    "pkg-py/src/shinyreact",
]

[dependency-groups]
examples = [
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "python-dotenv>=1.0.0",
    "chatlas>=0.1.0",
    "shinywidgets>=0.8.0",
    "plotly>=6.7.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    # starlette.testclient (used by tests/test_app.py) requires httpx; without
    # it pytest fails at *collection*, not with a test failure.
    "httpx>=0.27.0",
    "pyright>=1.1.0",
    "ruff>=0.6.0",
    "pytest-cov>=5.0.0",
    "tox>=4.0.0",
    "tox-uv>=1.0.0",
    "pre-commit>=4.0.0",
]
tests-e2e = [
    "pytest-playwright>=0.5.0",
    "shiny[playwright] @ git+https://github.com/posit-dev/py-shiny.git@schloerke/issue-2462",
    "shinywidgets>=0.8.0",
    "plotly>=6.7.0",
    "pandas>=2.1.0",
]

[tool.pytest.ini_options]
# Default test runs exclude the Playwright integration suite — those tests
# need the `tests-e2e` extras (browser, shiny[playwright]) and spin up a
# real Shiny process per app, which is too heavy for the unit test loop.
# Run the Playwright suite explicitly via `make py-test-e2e`.
testpaths = ["pkg-py/tests"]
addopts = "--ignore=pkg-py/tests/playwright"

[tool.pyright]
include = [
    "pkg-py/src/shinyreact",
]
pythonVersion = "3.10"
typeCheckingMode = "basic"

[tool.ruff]
line-length = 88
extend-exclude = ["examples/shiny-react-upstream"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.tox]
legacy_tox_ini = """
[tox]
env_list = type-py3{10,11,12,13,14}, py3{10,11,12,13,14}
isolated_build = True

[testenv]
package = wheel
wheel_build_env = .pkg
commands = pytest

[testenv:type]
deps =
  pyright
  pytest
commands = pyright
"""
