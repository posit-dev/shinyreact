name: py-release.yaml

on:
  workflow_dispatch:

env:
  UV_VERSION: "0.9.x"
  PYTHON_VERSION: 3.13

jobs:
  py-release:
    name: Build and release Python package
    runs-on: ubuntu-latest

    # Python release tags start with "py/v*"
    if: startsWith(github.ref, 'refs/tags/py/v')

    environment:
      name: pypi
      url: https://pypi.org/project/shinyjson/

    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: 🚀 Install uv
        uses: astral-sh/setup-uv@v6.1.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: 🐍 Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: 📦 Install the project
        run: uv sync --python ${{ env.PYTHON_VERSION }} --all-extras --all-groups

      - name: 📝 Check types
        run: make py-check-types

      - name: 📐 Check formatting
        run: make py-check-format

      - name: 🧪 Check tests
        run: make py-check-tests

      - name: 🧳 Build package
        run: uv build

      - name: 🚢 Publish release on PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
