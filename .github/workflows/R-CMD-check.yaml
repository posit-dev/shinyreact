name: R-CMD-check.yaml

on:
  workflow_dispatch:

permissions: read-all

jobs:
  routine:
    uses: rstudio/shiny-workflows/.github/workflows/routine.yaml@v1
    permissions:
      contents: write
    with:
      working-directory: pkg-r
      format-r-code: true
      check-js: false
  R-CMD-check:
    uses: rstudio/shiny-workflows/.github/workflows/R-CMD-check.yaml@v1
    with:
      working-directory: pkg-r
