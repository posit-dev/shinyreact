name: release-js

# Stages @posit-dev/shinyreact for npm. Trigger manually (workflow_dispatch) or
# by pushing a tag like js/v0.1.0 (the `js/` prefix distinguishes it from the
# Python and R release tags).
#
# This job does NOT publish. It runs `npm stage publish`, which uploads the
# tarball and leaves it pending until a human approves it — see the JS section
# of .claude/skills/release-shinyreact/SKILL.md. Approval requires proof of
# presence (2FA) and so cannot be done by CI.
#
# There is no NPM_TOKEN. Auth is npm trusted publishing (OIDC), configured at
# https://www.npmjs.com/package/@posit-dev/shinyreact/access against this
# workflow filename with `npm stage publish` as the allowed action. Provenance
# is automatic under OIDC; `--provenance` is not needed.
on:
  workflow_dispatch:
  push:
    tags:
      - "js/v*"

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: 🔎 Extract node version from .nvmrc
        id: nvm
        working-directory: pkg-js
        run: |
          echo "version=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: 🟡 Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "${{ steps.nvm.outputs.version }}"
          registry-url: "https://registry.npmjs.org"

      # Node 22 bundles npm 10.x; `npm stage publish` and OIDC auth need 11.15+.
      # Pinned to the major so an npm 12 cannot break a release unannounced.
      - name: 🆕 Upgrade npm
        run: npm install -g npm@11

      - name: 🔍 Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: pkg-js
        run: |
          tag_version="${GITHUB_REF_NAME#js/v}"
          pkg_version="$(npm pkg get version | tr -d '"')"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag $GITHUB_REF_NAME implies version $tag_version, but package.json says $pkg_version" >&2
            exit 1
          fi

      - name: 🆙 Install dependencies
        run: make js-setup-ci

      - name: 🧪 Lint and test
        run: |
          make js-lint
          make js-test

      - name: 🏭 Build (IIFE + npm ESM + types)
        working-directory: pkg-js
        run: npm run build

      - name: 🚀 Stage @posit-dev/shinyreact
        working-directory: pkg-js
        run: npm stage publish

      # `npm stage list` is not run here: only `npm stage publish` accepts an
      # OIDC token, every other stage subcommand needs proof of presence.
      - name: 📋 How to approve
        run: |
          {
            echo "### Staged, not published"
            echo
            echo "Nothing is on npm yet. Approve the stage (2FA required, so CI"
            echo "cannot), or leave it to abandon the release:"
            echo
            echo '```'
            echo 'npm stage list @posit-dev/shinyreact'
            echo 'npm stage approve <stage-id>'
            echo '```'
            echo
            echo "Or the Staged Packages tab at <https://www.npmjs.com/package/@posit-dev/shinyreact>."
          } >> "$GITHUB_STEP_SUMMARY"
