name: check-ui-frameworks

# End-to-end smoke test for the ui-frameworks gallery apps (issue #166). The
# other check-* workflows only build/import/type-check; this one actually serves
# each gallery and drives it headless, failing on any client React error or
# server-side traceback — the class of bug those checks miss.
#
# v1 scope: the Python galleries, served from the committed www/ bundles. R e2e
# and rebuilding the bundles from source are tracked follow-ups in #166.

on:
  push:
    branches: [main]
    paths:
      - "ui-frameworks/**"
      - ".github/workflows/check-ui-frameworks.yaml"
  pull_request:
    paths:
      - "ui-frameworks/**"
      - ".github/workflows/check-ui-frameworks.yaml"

permissions:
  contents: read

jobs:
  gallery-e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: 🚀 Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: 📦 Install the project
        run: uv sync --all-extras --all-groups

      - name: 🎭 Install Playwright + Chromium
        run: |
          uv pip install playwright
          uv run python -m playwright install --with-deps chromium

      - name: 🧪 Verify galleries render (serve + headless drive)
        run: uv run python ui-frameworks/tests/e2e/verify_galleries.py
