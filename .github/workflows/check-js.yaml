name: check-js

on:
  push:
    branches: [main]
    paths:
      - "js/**/*"
      - "pkg-py/src/shinyreact/www/**"
      - "pkg-r/inst/lib/shiny/**"
      - ".github/workflows/check-js.yaml"
  pull_request:
    paths:
      - "js/**/*"
      - "pkg-py/src/shinyreact/www/**"
      - "pkg-r/inst/lib/shiny/**"
      - ".github/workflows/check-js.yaml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 🔎 Extract node version from .nvmrc
        id: nvm
        working-directory: js
        run: |
          echo "version=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: 🟡 Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "${{ steps.nvm.outputs.version }}"

      - name: 🆙 Install dependencies
        run: make js-setup-ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📐 Lint JS (tsc --noEmit)
        run: make js-lint

      - name: 🧪 Run JS tests (vitest)
        run: make js-test

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔎 Extract node version from .nvmrc
        id: nvm
        working-directory: js
        run: |
          echo "version=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: 🟡 Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "${{ steps.nvm.outputs.version }}"

      - name: 🆙 Install dependencies
        run: make js-setup-ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏭 Build and update package dists
        run: make update-dist

      - name: 🧐 Check for uncommitted changes
        run: |
          if [[ `git status --porcelain` ]]; then
            git diff
            echo "Uncommitted changes found. Please commit any changes that result from 'make update-dist'."
            exit 1
          else
            echo "No uncommitted changes found."
          fi
