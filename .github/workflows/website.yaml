# Landing page + Python API (Quarto/quartodoc) + JS API (TypeDoc).
# The R API (r/) is built by website-r.yaml into the same gh-pages branch.
name: website

on:
  push:
    branches: [main]
    paths:
      - "pkg-py/**/*"
      - "pkg-js/**/*"
      - ".github/workflows/website.yaml"
  pull_request:
    paths:
      - "pkg-py/docs/**/*"
      - "pkg-js/typedoc.json"
      - ".github/workflows/website.yaml"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: 3.13
  QUARTO_VERSION: 1.11.4

jobs:
  docs-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🔵 Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ env.QUARTO_VERSION }}

      - name: 🚀 Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: 🐍 Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: 📦 Install shinyreact and dependencies
        run: uv sync --python ${{ env.PYTHON_VERSION }} --all-extras --all-groups

      - name: 🔌 Activate venv
        run: |
          source .venv/bin/activate
          echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV

      - name: 🟢 Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: pkg-js/.nvmrc
          cache: npm
          cache-dependency-path: pkg-js/package-lock.json

      - name: 🏭 Build landing page + Python API docs
        run: |
          make py-docs-api
          quarto render pkg-py/docs

      - name: 🏭 Build JS API docs
        run: |
          make js-setup-ci
          make js-docs

      # clean: false so r/ (deployed by website-r.yaml) survives.
      - name: 🚢 Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          folder: pkg-py/docs/_site
          branch: gh-pages
